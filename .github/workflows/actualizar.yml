name: Actualizar y publicar

on:
  schedule:
    - cron: "17 12 * * *"   # todos los días, 9:17 de Argentina
  workflow_dispatch:         # botón "Run workflow" para correrlo a mano
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mi-cine
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Consultar TMDB
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/actualizar.py
      - name: Guardar estado (para detectar cambios mañana)
        run: |
          git config user.name "mi-cine-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Datos del $(date +%F)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
